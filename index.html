
<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inicio de sesión</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="login-card">
    <h1>Iniciar sesión</h1>
    <p class="description">Ingresa tu usuario y contraseña.</p>

    <form id="login-form" novalidate>
      <label for="usuario">Usuario</label>
      <input
        id="usuario"
        name="usuario"
        type="text"
        autocomplete="username"
        aria-describedby="error-usuario"
        required
      >
      <small id="error-usuario" class="field-error"></small>

      <label for="contrasena">Contraseña</label>
      <input
        id="contrasena"
        name="contrasena"
        type="password"
        autocomplete="current-password"
        aria-describedby="error-contrasena"
        required
      >
      <small id="error-contrasena" class="field-error"></small>

      <button type="submit">Ingresar</button>
      <p id="mensaje" role="status" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
